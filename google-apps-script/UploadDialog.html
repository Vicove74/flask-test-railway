<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; padding: 10px; }
      #submitBtn { background-color: #4CAF50; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; }
      #submitBtn:disabled { background-color: #cccccc; cursor: not-allowed; }
      #status { margin-top: 10px; font-style: italic; color: #555; }
    </style>
  </head>
  <body>
    <form id="uploadForm">
      <p>Select the Excel file (.xlsx) to process:</p>
      <input type="file" name="file" id="fileInput" accept=".xlsx, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
      <br><br>
      <input type="button" value="Process File" id="submitBtn" onclick="processForm()">
    </form>
    <div id="status"></div>

    <script>
      function processForm() {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];

        if (!file) {
          document.getElementById('status').innerText = 'Please select a file first.';
          return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        document.getElementById('status').innerText = 'Uploading and processing... Please wait.';

        const reader = new FileReader();
        reader.onload = function(e) {
          const fileData = {
            name: file.name,
            mimeType: file.type,
            bytes: e.target.result.split(',')[1]
          };
          google.script.run
            .withSuccessHandler(onSuccess)
            .withFailureHandler(onFailure)
            .processFileFromUpload(fileData);
        };
        reader.readAsDataURL(file);
      }

      function onSuccess(message) {
        alert(message);
        google.script.host.close();
      }

      function onFailure(error) {
        alert('Script Error: ' + error.message);
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('status').innerText = 'An error occurred. Please try again.';
      }
    </script>
  </body>
</html>
